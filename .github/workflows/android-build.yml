name: Android debug APK
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend base URL (use http://<Windows-PC-LAN-IP>:8000/ for a trusted local Wi-Fi test, or HTTPS for hosted backend)"
        required: false
        default: "http://10.0.2.2:8000/"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:8000/' }}
        run: gradle -p android "-PSEEFORME_API_BASE_URL=${API_BASE_URL}" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seeforme-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
